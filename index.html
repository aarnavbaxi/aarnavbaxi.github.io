<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarnav Baxi</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    
    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      isolation: isolate;
      overflow: hidden;
    }
    #c {
      position: absolute;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      filter: blur(20px) contrast(24);
    }
    #blob-color {
      position: absolute;
      inset: 0;
      background: #4B9CD3;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 2rem;
      pointer-events: none;
    }

    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(3.2rem, 9.5vw, 9rem);
      letter-spacing: -0.04em;
      color: #13294B;
      line-height: 0.95;
      margin-bottom: 2rem;
    }

    .phrase-wrap {
      perspective: 900px;
    }

    .phrase {
      display: inline-block;
      background: #ffffff;
      padding: 0.4rem 1.25rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      letter-spacing: 0.13em;
      color: #4B9CD3;
      white-space: nowrap;
      transform-origin: 50% 50%;
    }

    @media (max-width: 480px) {
      .phrase { font-size: 0.74rem; letter-spacing: 0.09em; }
    }

    @media (prefers-reduced-motion: reduce) {
      #c { display: none; }
      .name, .phrase { opacity: 1 !important; transform: none !important; }
    }

    #logo {
      position: fixed;
      top: 1.25rem;
      left: 1.75rem;
      z-index: 200;
    }
    #logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    #nav-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.75rem;
      z-index: 200;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
    }
    #nav-toggle span {
      display: block;
      width: 26px;
      height: 2px;
      background: #13294B;
      border-radius: 2px;
      transform-origin: center;
      transition: background 0.2s;
    }
    #nav-toggle.is-open span { background: #ffffff; }

    #nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      opacity: 0;
      pointer-events: none;
    }
    .nav-panel {
      position: relative;
      overflow: hidden;
      background: #13294B;
    }
    .panel-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .nav-panel a {
      position: absolute;
      top: 1.75rem;
      left: 1.75rem;
      z-index: 1;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 5vw, 5rem);
      letter-spacing: -0.02em;
      color: #ffffff;
      text-decoration: none;
      opacity: 0;
      transform: translateY(24px);
    }
    .nav-panel a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <a id="logo" href="/">
    <img src="/assets/logo.png" alt="Aarnav Baxi">
  </a>

  <button id="nav-toggle" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="nav-overlay" aria-hidden="true">
    <div class="nav-panel" id="panel-about">
      <canvas class="panel-canvas" id="canvas-about"></canvas>
      <a href="/about/">about</a>
    </div>
    <div class="nav-panel" id="panel-experience">
      <canvas class="panel-canvas" id="canvas-experience"></canvas>
      <a href="/experience/">experience</a>
    </div>
    <div class="nav-panel" id="panel-projects">
      <canvas class="panel-canvas" id="canvas-projects"></canvas>
      <a href="/projects/">projects</a>
    </div>
  </nav>

  <div id="scene">
    <canvas id="c"></canvas>
    <div id="blob-color"></div>
  </div>

  <div class="hero">
    <h1 class="name">aarnav baxi</h1>
    <div class="phrase-wrap">
      <span id="phrase" class="phrase">tarheel</span>
    </div>
  </div>

  <script>
    const PHRASES   = ["tarheel", "cookie connoisseur", "entrepreneur", "apparel enthusiast", "software engineer", "foxboro faithful", "gamer", "bronx bomber", "gym-goer"];
    const HOLD_MS   = 2000;
    const reduced   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const phraseEl  = document.getElementById('phrase');
    let   phraseIdx = 0;

    if (reduced) {
      startCycling();
    } else {
      gsap.set('.name',   { opacity: 0, y: 28 });
      gsap.set('#phrase', { opacity: 0 });
      gsap.to('.name',   { opacity: 1, y: 0, duration: 0.8, delay: 0.2,  ease: 'power3.out' });
      gsap.to('#phrase', { opacity: 1,        duration: 0.6, delay: 1.0,  ease: 'power2.out', onComplete: startCycling });
    }

    function startCycling() { setTimeout(nextPhrase, HOLD_MS); }
    function nextPhrase() {
      if (reduced) {
        phraseIdx = (phraseIdx + 1) % PHRASES.length;
        phraseEl.textContent = PHRASES[phraseIdx];
        setTimeout(nextPhrase, HOLD_MS);
        return;
      }
      gsap.to(phraseEl, {
        rotateX: -90, transformPerspective: 900,
        duration: 0.18, ease: 'power2.in',
        onComplete() {
          phraseIdx = (phraseIdx + 1) % PHRASES.length;
          phraseEl.textContent = PHRASES[phraseIdx];
          gsap.fromTo(phraseEl,
            { rotateX: 90 },
            { rotateX: 0, transformPerspective: 900, duration: 0.22, ease: 'power2.out', onComplete: startCycling }
          );
        }
      });
    }

    const toggle  = document.getElementById('nav-toggle');
    const overlay = document.getElementById('nav-overlay');
    const bars    = toggle.querySelectorAll('span');
    const links   = overlay.querySelectorAll('.nav-panel a');
    let navOpen   = false;

    toggle.addEventListener('click', () => {
      navOpen = !navOpen;
      toggle.setAttribute('aria-expanded', navOpen);
      overlay.setAttribute('aria-hidden', !navOpen);

      if (navOpen) {
        toggle.classList.add('is-open');
        overlay.style.pointerEvents = 'auto';
        gsap.to('#logo', { opacity: 0, duration: 0.2 });
        startPanelPatterns();
        gsap.to(overlay, { opacity: 1, duration: 0.35, ease: 'power2.out' });
        gsap.to(links, { opacity: 1, y: 0, duration: 0.4, stagger: 0.07, ease: 'power3.out', delay: 0.1 });
        gsap.to(bars[0], { y: 7,  rotation: 45,  duration: 0.3, ease: 'power2.inOut' });
        gsap.to(bars[1], { opacity: 0,            duration: 0.2 });
        gsap.to(bars[2], { y: -7, rotation: -45, duration: 0.3, ease: 'power2.inOut' });
      } else {
        toggle.classList.remove('is-open');
        overlay.style.pointerEvents = 'none';
        gsap.to('#logo', { opacity: 1, duration: 0.2, delay: 0.2 });
        gsap.to(overlay, { opacity: 0, duration: 0.3, ease: 'power2.in' });
        gsap.to(links,   { opacity: 0, y: 24, duration: 0.25, stagger: 0.04 });
        // X → bars
        gsap.to(bars[0], { y: 0, rotation: 0, duration: 0.3, ease: 'power2.inOut' });
        gsap.to(bars[1], { opacity: 1,         duration: 0.2, delay: 0.1 });
        gsap.to(bars[2], { y: 0, rotation: 0, duration: 0.3, ease: 'power2.inOut' });
      }
    });

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const mouse  = { x: -9999, y: -9999 };

    document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    function resize() {
      canvas.width  = window.innerWidth  + 80;
      canvas.height = window.innerHeight + 80;
    }
    resize();
    window.addEventListener('resize', resize);

    const RADII = [130, 115, 105, 95, 88, 80, 74, 68, 60];

    class Blob {
      constructor(r) {
        this.r  = r;
        const cx = canvas.width  / 2;
        const cy = canvas.height / 2;
        // start loosely scattered around center
        this.x  = cx + (Math.random() - 0.5) * canvas.width  * 0.45;
        this.y  = cy + (Math.random() - 0.5) * canvas.height * 0.45;
        this.vx = (Math.random() - 0.5) * 1.0;
        this.vy = (Math.random() - 0.5) * 1.0;
        // each blob drifts on its own slow sine path
        this.ox = Math.random() * Math.PI * 2;
        this.oy = Math.random() * Math.PI * 2;
        this.ox_speed = 0.003 + Math.random() * 0.003;
        this.oy_speed = 0.003 + Math.random() * 0.003;
        this.t  = Math.random() * 1000;
      }

      step() {
        this.t++;
        const cx = canvas.width  / 2;
        const cy = canvas.height / 2;

        const driftX = Math.sin(this.t * this.ox_speed + this.ox) * 0.18;
        const driftY = Math.cos(this.t * this.oy_speed + this.oy) * 0.18;
        this.vx += driftX;
        this.vy += driftY;

        this.vx += (cx - this.x) * 0.0018;
        this.vy += (cy - this.y) * 0.0018;

        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        const MR = 170;
        if (d < MR && d > 1) {
          const f = ((MR - d) / MR) * 2.2;
          this.vx += (dx / d) * f;
          this.vy += (dy / d) * f;
        }

        this.vx *= 0.92;
        this.vy *= 0.92;

        this.x += this.vx;
        this.y += this.vy;

        const pad = this.r * 0.5;
        if (this.x < pad)                 this.vx += (pad - this.x)                 * 0.12;
        if (this.x > canvas.width - pad)  this.vx -= (this.x - canvas.width + pad)  * 0.12;
        if (this.y < pad)                 this.vy += (pad - this.y)                 * 0.12;
        if (this.y > canvas.height - pad) this.vy -= (this.y - canvas.height + pad) * 0.12;
      }
    }

    const blobs = RADII.map(r => new Blob(r));

    function frame() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#000000';
      blobs.forEach(b => {
        b.step();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(frame);
    }
    frame();

    const PW = () => Math.floor(window.innerWidth / 3);
    const PH = () => window.innerHeight;

    function makeBg(panel) {
      let hovered = false;
      panel.addEventListener('mouseenter', () => { hovered = true; });
      panel.addEventListener('mouseleave', () => { hovered = false; });
      return () => hovered ? '#4B9CD3' : '#13294B';
    }

    function startPanelPatterns() {
      startPanelPatterns = () => {};

      (function() {
        const cv = document.getElementById('canvas-about');
        const ct = cv.getContext('2d');
        cv.width = PW(); cv.height = PH();
        const bg = makeBg(document.getElementById('panel-about'));
        let t = 0;
        const waves = [
          { amp: 22, freq: 0.010, speed: 0.018, width: 1.0,  color: '#ffffff' },
          { amp: 45, freq: 0.007, speed: 0.010, width: 4.0,  color: '#4B9CD3' },
          { amp: 30, freq: 0.012, speed: 0.022, width: 1.5,  color: '#ffffff' },
          { amp: 60, freq: 0.005, speed: 0.008, width: 6.0,  color: '#4B9CD3' },
          { amp: 18, freq: 0.015, speed: 0.025, width: 1.0,  color: '#ffffff' },
          { amp: 50, freq: 0.006, speed: 0.012, width: 3.5,  color: '#4B9CD3' },
          { amp: 35, freq: 0.009, speed: 0.016, width: 2.0,  color: '#ffffff' },
          { amp: 70, freq: 0.004, speed: 0.007, width: 5.0,  color: '#4B9CD3' },
        ];
        function draw() {
          ct.fillStyle = bg();
          ct.fillRect(0, 0, cv.width, cv.height);
          waves.forEach((w, i) => {
            const yBase = (cv.height / (waves.length + 1)) * (i + 1);
            ct.beginPath();
            for (let x = 0; x <= cv.width; x += 3) {
              const y = yBase + Math.sin(x * w.freq + t * w.speed) * w.amp;
              x === 0 ? ct.moveTo(x, y) : ct.lineTo(x, y);
            }
            ct.strokeStyle = w.color;
            ct.lineWidth = w.width;
            ct.stroke();
          });
          t++;
          requestAnimationFrame(draw);
        }
        draw();
      })();

      (function() {
        const cv = document.getElementById('canvas-experience');
        const ct = cv.getContext('2d');
        cv.width = PW(); cv.height = PH();
        const bg = makeBg(document.getElementById('panel-experience'));
        const N = 80;
        const drops = Array.from({ length: N }, () => ({
          x:     Math.random() * cv.width,
          y:     Math.random() * cv.height,
          len:   8  + Math.random() * 40,
          speed: 2  + Math.random() * 5,
          alpha: 0.3 + Math.random() * 0.7,
          width: 0.8 + Math.random() * 1.6
        }));
        function draw() {
          ct.fillStyle = bg();
          ct.fillRect(0, 0, cv.width, cv.height);
          drops.forEach(d => {
            d.y += d.speed;
            if (d.y - d.len > cv.height) {
              d.y = -d.len;
              d.x = Math.random() * cv.width;
            }
            ct.beginPath();
            ct.moveTo(d.x, d.y - d.len);
            ct.lineTo(d.x, d.y);
            ct.strokeStyle = `rgba(255,255,255,${d.alpha})`;
            ct.lineWidth = d.width;
            ct.stroke();
          });
          requestAnimationFrame(draw);
        }
        draw();
      })();

      (function() {
        const cv = document.getElementById('canvas-projects');
        const ct = cv.getContext('2d');
        cv.width = PW(); cv.height = PH();
        const bg = makeBg(document.getElementById('panel-projects'));
        const STYLES = ['fill-blue', 'stroke-white', 'stroke-white', 'fill-blue-faint', 'stroke-white'];
        const shapes = Array.from({ length: 22 }, () => ({
          x: Math.random() * cv.width,  y: Math.random() * cv.height,
          vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
          r: 14 + Math.random() * 44,
          sides: [3, 4, 4, 6][Math.floor(Math.random() * 4)],
          angle: Math.random() * Math.PI * 2,
          spin:  (Math.random() - 0.5) * 0.014,
          style: STYLES[Math.floor(Math.random() * STYLES.length)],
          lw:   1 + Math.random() * 2.5
        }));
        function poly(x, y, r, sides, angle) {
          ct.beginPath();
          for (let i = 0; i < sides; i++) {
            const a = angle + (Math.PI * 2 / sides) * i;
            i === 0 ? ct.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r)
                    : ct.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          }
          ct.closePath();
        }
        function draw() {
          ct.fillStyle = bg();
          ct.fillRect(0, 0, cv.width, cv.height);
          shapes.forEach(s => {
            s.x += s.vx; s.y += s.vy; s.angle += s.spin;
            if (s.x < -s.r) s.x = cv.width  + s.r;
            if (s.x > cv.width  + s.r) s.x = -s.r;
            if (s.y < -s.r) s.y = cv.height + s.r;
            if (s.y > cv.height + s.r) s.y = -s.r;
            poly(s.x, s.y, s.r, s.sides, s.angle);
            if (s.style === 'fill-blue') {
              ct.fillStyle = '#4B9CD3';
              ct.fill();
            } else if (s.style === 'fill-blue-faint') {
              ct.fillStyle = 'rgba(75,156,211,0.35)';
              ct.fill();
              ct.strokeStyle = '#4B9CD3';
              ct.lineWidth = s.lw;
              ct.stroke();
            } else {
              ct.strokeStyle = '#ffffff';
              ct.lineWidth = s.lw;
              ct.stroke();
            }
          });
          requestAnimationFrame(draw);
        }
        draw();
      })();
    }
  </script>

</body>
</html>
